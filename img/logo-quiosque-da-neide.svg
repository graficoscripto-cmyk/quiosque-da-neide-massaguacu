<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" role="img" aria-label="Quiosque da Neide">
  <defs>
    <path id="arcoTopo" d="M 18 82 Q 110 24 202 82" fill="none"/>
  </defs>
  <!-- Aro laranja tropical com asas de sol/onda -->
  <g fill="#E84A1B" stroke="#11161B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 48 92 H 24 C 19 92 19 99 24 99 H 42 L 18 104 C 13 105 13 112 18 112 H 40 L 22 117 C 17 118 18 124 23 124 H 48 Z"/>
    <path d="M 172 92 H 196 C 201 92 201 99 196 99 H 178 L 202 104 C 207 105 207 112 202 112 H 180 L 198 117 C 203 118 202 124 197 124 H 172 Z"/>
    <ellipse cx="110" cy="122" rx="64" ry="44" fill="#11161B"/>
    <ellipse cx="110" cy="122" rx="64" ry="44" fill="none" stroke="#E84A1B" stroke-width="9"/>
    <ellipse cx="110" cy="122" rx="68.5" ry="48.5" fill="none" stroke="#11161B" stroke-width="3.5"/>
    <ellipse cx="110" cy="122" rx="58.5" ry="38.5" fill="none" stroke="#11161B" stroke-width="3"/>
  </g>
  <!-- Espuma/folhagem interna -->
  <g fill="#FFFDF8" opacity="0.92">
    <circle cx="68" cy="108" r="5"/><circle cx="80" cy="98" r="6"/><circle cx="94" cy="95" r="4.5"/>
    <circle cx="145" cy="104" r="5"/><circle cx="154" cy="116" r="6"/><circle cx="148" cy="132" r="5"/>
    <circle cx="74" cy="144" r="5"/><circle cx="90" cy="150" r="6"/><circle cx="108" cy="152" r="5"/>
  </g>
  <!-- Golfinho azul-celeste -->
  <g stroke="#11161B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cauda -->
    <path d="M 105 88 L 96 69 C 82 65 73 61 69 57 C 82 59 95 62 106 66 C 115 61 124 56 132 52 C 130 61 124 69 114 73 L 116 90 Z" fill="#00AEF0"/>
    <!-- Corpo e barbatana dorsal -->
    <path d="M 46 134 C 42 126 51 116 66 112 C 82 98 103 91 122 92 L 146 66 C 149 77 146 91 140 100 C 154 109 160 124 152 138 C 138 144 114 144 88 139 C 72 141 52 141 46 134 Z" fill="#00AEF0"/>
    <!-- Bico / sorriso -->
    <path d="M 46 134 C 58 134 70 131 79 126" fill="none" stroke-width="3.8"/>
    <!-- Óculos de sol -->
    <ellipse cx="75" cy="120" rx="10" ry="6.5" transform="rotate(-10 75 120)" fill="#11161B"/>
    <ellipse cx="72" cy="118" rx="3" ry="1.8" fill="#FFFDF8" stroke="none"/>
    <!-- Listras dinâmicas -->
    <path d="M 114 112 C 130 111 144 115 153 122" fill="none" stroke-width="5"/>
    <path d="M 118 123 C 132 123 144 126 151 132" fill="none" stroke-width="5"/>
    <!-- Nadadeira peitoral -->
    <path d="M 114 132 C 122 148 138 159 156 158 C 153 146 142 135 128 130 Z" fill="#00AEF0"/>
  </g>
  <!-- Tipografia arqueada QUIOSQUE da NEIDE -->
  <text font-family="'Bricolage Grotesque', Impact, sans-serif" font-weight="800" font-size="25" fill="#11161B" letter-spacing="0.5" text-anchor="middle">
    <textPath href="#arcoTopo" startOffset="50%">QUIOSQUE da NEIDE</textPath>
  </text>
  <!-- Subtítulo Praia da Cocanha -->
  <text x="110" y="191" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13.5" fill="#11161B" text-anchor="middle" letter-spacing="0.4">Praia da Cocanha · Massaguaçu</text>
</svg>
